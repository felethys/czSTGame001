<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空文字放置游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .game-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .game-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }
        
        .game-section h2 {
            color: #00ffff;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .ship-list {
            display: grid;
            gap: 15px;
        }
        
        .ship-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .ship-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .ship-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #ff00ff;
            margin-bottom: 5px;
        }
        
        .ship-stats {
            font-size: 0.9em;
            color: #cccccc;
        }
        
        .sector-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .sector-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .sector-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .sector-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .sector-card.locked:hover {
            transform: none;
        }
        
        .sector-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .sector-safe {
            color: #00ff00;
        }
        
        .sector-rich {
            color: #ffd700;
        }
        
        .sector-danger {
            color: #ff6b6b;
        }
        
        .sector-anomaly {
            color: #ff00ff;
        }
        
        .sector-forbidden {
            color: #ff0000;
        }
        
        .mission-status {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .mission-status h2 {
            color: #00ffff;
            margin-bottom: 15px;
        }
        
        .progress-bar {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .progress-fill {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .action-btn {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .log-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .log-section h2 {
            color: #ffff00;
            margin-bottom: 15px;
        }
        
        .log-content {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
        }
        
        .log-entry {
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #888;
            font-size: 0.9em;
        }
        
        .log-message {
            margin-top: 5px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #888;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        @media (max-width: 768px) {
            .game-content {
                grid-template-columns: 1fr;
            }
            
            .sector-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>太空文字放置游戏</h1>
            <p>探索未知星域，收集珍贵资源，打造最强舰队！</p>
        </header>
        
        <div class="mission-status">
            <h2>当前任务状态</h2>
            <p>星尘号 - 安全星区探索</p>
            <div class="progress-bar">
                <div class="progress-fill" id="missionProgress"></div>
            </div>
            <p>任务进度: <span id="progressText">0%</span></p>
            <div class="action-buttons">
                <button class="action-btn" id="startMission">开始任务</button>
                <button class="action-btn" id="showHangar">机库</button>
            </div>
        </div>
        
        <div class="game-content">
            <div class="game-section">
                <h2>🚀 我的舰队</h2>
                <div class="ship-list">
                    <div class="ship-card">
                        <div class="ship-name">星尘号</div>
                        <div class="ship-stats">打捞: 12 | 战斗: 10 | 航程: 18</div>
                    </div>
                    <div class="ship-card">
                        <div class="ship-name">猎风号</div>
                        <div class="ship-stats">打捞: 8 | 战斗: 15 | 航程: 12</div>
                    </div>
                    <div class="ship-card">
                        <div class="ship-name">灰隼号</div>
                        <div class="ship-stats">打捞: 15 | 战斗: 8 | 航程: 25</div>
                    </div>
                </div>
            </div>
            
            <div class="game-section">
                <h2>🌌 可探索星区</h2>
                <div class="sector-grid">
                    <div class="sector-card">
                        <div class="sector-name sector-safe">安全带</div>
                        <div>等级 1+</div>
                    </div>
                    <div class="sector-card">
                        <div class="sector-name sector-rich">富矿带</div>
                        <div>等级 2+</div>
                    </div>
                    <div class="sector-card">
                        <div class="sector-name sector-danger">危险带</div>
                        <div>等级 3+</div>
                    </div>
                    <div class="sector-card">
                        <div class="sector-name sector-anomaly">异常带</div>
                        <div>等级 4+</div>
                    </div>
                    <div class="sector-card locked">
                        <div class="sector-name sector-forbidden">禁区</div>
                        <div>等级 5+</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="log-section">
            <h2>📋 任务日志</h2>
            <div class="log-content" id="logContent">
                <div class="log-entry">
                    <div class="log-time">00:00</div>
                    <div class="log-message">欢迎来到太空文字放置游戏！</div>
                </div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>太空文字放置游戏 © 2026 - Web试玩版</p>
        <p>当前为演示版本，展示游戏界面和交互功能</p>
    </footer>
    
    <script>
        // 游戏状态
        let gameState = {
            missionProgress: 0,
            isMissionActive: false,
            logs: []
        };
        
        // DOM元素
        const progressFill = document.getElementById('missionProgress');
        const progressText = document.getElementById('progressText');
        const startMissionBtn = document.getElementById('startMission');
        const showHangarBtn = document.getElementById('showHangar');
        const logContent = document.getElementById('logContent');
        
        // 添加日志
        function addLog(message) {
            const time = new Date().toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.innerHTML = `
                <div class="log-time">${time}</div>
                <div class="log-message">${message}</div>
            `;
            
            logContent.appendChild(logEntry);
            logContent.scrollTop = logContent.scrollHeight;
            
            gameState.logs.push({ time, message });
        }
        
        // 更新进度
        function updateProgress(progress) {
            gameState.missionProgress = progress;
            progressFill.style.width = progress + '%';
            progressText.textContent = Math.round(progress) + '%';
        }
        
        // 开始任务
        function startMission() {
            if (gameState.isMissionActive) return;
            
            gameState.isMissionActive = true;
            startMissionBtn.disabled = true;
            addLog('任务开始！星尘号正在前往安全星区...');
            
            // 模拟任务进度
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    gameState.isMissionActive = false;
                    startMissionBtn.disabled = false;
                    addLog('任务完成！获得资源奖励。');
                    
                    // 显示奖励
                    setTimeout(() => {
                        addLog('奖励：铁 x25, 铜 x18, 铬 x12');
                    }, 1000);
                }
                updateProgress(progress);
            }, 500);
        }
        
        // 显示机库
        function showHangar() {
            addLog('打开机库界面...');
            // 这里可以添加机库界面的显示逻辑
        }
        
        // 事件监听
        startMissionBtn.addEventListener('click', startMission);
        showHangarBtn.addEventListener('click', showHangar);
        
        // 舰队卡片点击
        document.querySelectorAll('.ship-card').forEach(card => {
            card.addEventListener('click', function() {
                const shipName = this.querySelector('.ship-name').textContent;
                addLog(`选择飞船：${shipName}`);
            });
        });
        
        // 星区卡片点击
        document.querySelectorAll('.sector-card:not(.locked)').forEach(card => {
            card.addEventListener('click', function() {
                const sectorName = this.querySelector('.sector-name').textContent;
                addLog(`选择星区：${sectorName}`);
            });
        });
        
        // 初始化
        addLog('游戏初始化完成！');
        updateProgress(0);
    </script>
</body>
</html>
